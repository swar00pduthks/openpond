apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openpond-ingress
  namespace: openpond
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: openpond.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openpond-core-svc
            port:
              number: 80
