apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pondhouse-ingress
  namespace: pondhouse
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: pondhouse.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pondhouse-core-svc
            port:
              number: 80
